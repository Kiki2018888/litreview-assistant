# A generic, single database configuration.

[alembic]
# Path to migration scripts (relative to this file).
script_location = alembic

# Template used to generate migration file names
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path path, prepended to sys.path if present.
# Points to backend/ parent (project root) so `from backend.xxx import yyy` works.
prepend_sys_path = ..

# Timezone to use when rendering the date within the migration file.
# timezone =

# Max length of characters to apply to the "slug" field.
# truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command.
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without a source .py file.
# sourceless = false

# Version location specification.
# version_locations = %(here)s/bar:%(here)s/bat:alembic/versions

# Version path separator.
version_path_separator = os

# sqlalchemy.url is injected at runtime by env.py from backend.services.db.
# Leave blank to avoid hardcoding the connection string in this ini file.
sqlalchemy.url =


[post_write_hooks]

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
